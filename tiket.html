<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagi open tiket</title>
    <link rel="stylesheet" href="tiketstyle.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea, select, button {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #007BFF;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .output {
            background-color: #f8f9fa;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        /* TAMBAHAN UNTUK PILIHAN JENIS TIKET */
        .ticket-type {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 15px;
        }

        .ticket-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            margin: 0;
            cursor: pointer;
        }

        .ticket-option input[type="radio"] {
            width: auto;
            margin: 0;
            padding: 0;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Form Open Tiket</h1>

    <form id="customerForm">

        <!-- TAMBAHAN JENIS TIKET -->
        <label>Jenis Tiket:</label>

        <div class="ticket-type">

            <label class="ticket-option">
                <input type="radio" name="ticketType" value="Project">
                Reaksi Cepat Jatim
            </label>

            <label class="ticket-option">
                <input type="radio" name="ticketType" value="Maintenance">
                Maintenance FTTH Kediri
            </label>

        </div>

        <label for="ticketNumber">Nomor Tiket:</label>
        <input type="text" id="ticketNumber" name="ticketNumber" required>

        <label for="picName">PIC Pelanggan:</label>
        <input type="text" id="picName" name="picName" required>

        <label for="idCust">ID Cust:</label>
        <input type="text" id="idCust" name="idCust" required>

        <label for="address">Alamat:</label>
        <textarea id="address" name="address" rows="3" required></textarea>

        <label for="phone">Telepon:</label>
        <input type="text" id="phone" name="phone" required>

        <label for="serviceType">Service Type:</label>
        <input type="text" id="serviceType" name="serviceType" required>

        <label for="olt">OLT:</label>
        <input type="text" id="olt" name="olt" required>

        <label for="issue">Indikasi Masalah:</label>
        <textarea id="issue" name="issue" rows="2" required></textarea>

        <label for="location">Shareloc</label>
        <input id="location" name="location" name="location" required>

        <label for="filledBy">Nama Pengisi Form:</label>
        <input type="text" id="filledBy" name="filledBy" required>

        <button type="button" onclick="generateTemplate()">Submit</button>
        <button type="button" onclick="copyTemplate()">Copy Template</button>

    </form>

    <h2>Hasil Template</h2>
    <div class="output" id="output"></div>

    <script>

        function generateTemplate() {

            // Mengambil pilihan jenis tiket
            const selectedTicket = document.querySelector(
                'input[name="ticketType"]:checked'
            );

            const ticketType = selectedTicket
                ? selectedTicket.value
                : "";

            const ticketNumber = document.getElementById('ticketNumber').value;
            const picName = document.getElementById('picName').value;
            const idCust = document.getElementById('idCust').value;
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const serviceType = document.getElementById('serviceType').value;
            const pop = document.getElementById('olt').value;
            const issue = document.getElementById('issue').value;
            const location = document.getElementById('location').value;
            const filledBy = document.getElementById('filledBy').value;

           const template = `Dear team ${ticketType},
Mohon bantuan pengecekan pelanggan dengan detail berikut ini:

Nomor tiket		: ${ticketNumber}

PIC Pelanggan	: ${picName}
ID Cust			: ${idCust}
Alamat			: ${address}
Telepon			: ${phone}
Service Type		: ${serviceType}
OLT			: ${pop}

Indikasi: ${issue}

📍${location}

Demikian kami sampaikan,
terima kasih
${filledBy}`;

            document.getElementById('output').textContent = template;
        }

        function copyTemplate() {

            const output = document.getElementById('output').textContent;

            if (output) {

                navigator.clipboard.writeText(output)
                    .then(() => alert("Template berhasil disalin ke clipboard!"))
                    .catch(() => alert("Gagal menyalin template. Silakan coba lagi."));

            } else {

                alert("Tidak ada template untuk disalin. Silakan isi formulir dan tekan Submit.");

            }
        }

    </script>

</body>
</html>
