<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagi open tiket</title>
    <link rel="stylesheet" href="tiketstyle.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea, select, button {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #007BFF;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .output {
            background-color: #f8f9fa;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            white-space: pre-wrap;
            margin-bottom: 10px;
        }

        /* =========================
           PILIHAN JENIS TIKET
           ========================= */

        .ticket-type {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-bottom: 15px;
        }

        .ticket-option {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            margin: 0;
            cursor: pointer;
        }

        .ticket-option input[type="radio"] {
            width: auto;
            margin: 0;
            padding: 0;
            cursor: pointer;
        }

        /* =========================
           INSERT SHARELOC
           ========================= */

        .shareloc-button {
            background: #ffffff;
            color: #4f46e5;
            border: 1px solid #4f46e5;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .shareloc-button:hover {
            background: #4f46e5;
            color: white;
        }

        .shareloc-section {
            display: none;
        }

        .shareloc-section.active {
            display: block;
        }

        .shareloc-button.active {
            background: #4f46e5;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Form Open Tiket</h1>

    <form id="customerForm">

        <!-- =========================
             JENIS TIKET
             ========================= -->

        <label>Jenis Tiket:</label>

        <div class="ticket-type">

            <label class="ticket-option">
                <input type="radio" name="ticketType" value="Project">
                SDI-Reaksi Cepat Jatim
            </label>

            <label class="ticket-option">
                <input type="radio" name="ticketType" value="Maintenance">
                Maintenance FTTH Kediri
            </label>

        </div>


        <!-- =========================
             NOMOR TIKET
             ========================= -->

        <label for="ticketNumber">Nomor Tiket:</label>
        <input type="text" id="ticketNumber" name="ticketNumber" required>


        <!-- =========================
             PIC PELANGGAN
             ========================= -->

        <label for="picName">PIC Pelanggan:</label>
        <input type="text" id="picName" name="picName" required>


        <!-- =========================
             ID CUST
             ========================= -->

        <label for="idCust">ID Cust:</label>
        <input type="text" id="idCust" name="idCust" required>


        <!-- =========================
             ALAMAT
             ========================= -->

        <label for="address">Alamat:</label>
        <textarea id="address" name="address" rows="3" required></textarea>


        <!-- =========================
             TELEPON
             ========================= -->

        <label for="phone">Telepon:</label>
        <input type="text" id="phone" name="phone" required>


        <!-- =========================
             SERVICE TYPE
             ========================= -->

        <label for="serviceType">Service Type:</label>
        <input type="text" id="serviceType" name="serviceType" required>


        <!-- =========================
             OLT
             ========================= -->

        <label for="olt">OLT:</label>
        <input type="text" id="olt" name="olt" required>


        <!-- =========================
             INDIKASI MASALAH
             ========================= -->

        <label for="issue">Indikasi Masalah:</label>
        <textarea id="issue" name="issue" rows="2" required></textarea>


        <!-- =========================
             NAMA PENGISI FORM
             ========================= -->

        <label for="filledBy">Nama Pengisi Form:</label>
        <input type="text" id="filledBy" name="filledBy" required>

        <!-- =========================
             SHARELOC
             MUNCUL DI SINI
             ========================= -->

        <div id="sharelocSection" class="shareloc-section">

            <label for="location">Shareloc:</label>

            <input
                type="url"
                id="location"
                name="location"
                placeholder="https://maps.google.com/...">

        </div>

        <!-- =========================
             SUBMIT
             ========================= -->

        <button type="button" onclick="generateTemplate()">
            Submit
        </button>


        <!-- =========================
             INSERT SHARELOC
             ========================= -->

        <button
            type="button"
            id="sharelocButton"
            class="shareloc-button"
            onclick="toggleShareloc()">
            + Insert Shareloc
        </button>


        <!-- =========================
             COPY TEMPLATE
             ========================= -->

        <button type="button" onclick="copyTemplate()">
            Copy Template
        </button>

    </form>


    <!-- =========================
         HASIL TEMPLATE
         ========================= -->

    <h2>Hasil Template</h2>

    <div class="output" id="output"></div>


    <script>

        /* ==========================================
           INSERT / REMOVE SHARELOC
           ========================================== */

        function toggleShareloc() {

            const section =
                document.getElementById('sharelocSection');

            const button =
                document.getElementById('sharelocButton');


            if (section.classList.contains('active')) {

                // Matikan Shareloc
                section.classList.remove('active');

                button.classList.remove('active');

                button.textContent =
                    '+ Insert Shareloc';

                // Kosongkan kolom Shareloc
                document.getElementById('location').value = '';

            } else {

                // Aktifkan Shareloc
                section.classList.add('active');

                button.classList.add('active');

                button.textContent =
                    '− Remove Shareloc';
            }
        }


        /* ==========================================
           GENERATE TEMPLATE
           ========================================== */

        function generateTemplate() {

            // Mengambil pilihan jenis tiket
            const selectedTicket =
                document.querySelector(
                    'input[name="ticketType"]:checked'
                );

            const ticketType =
                selectedTicket
                    ? selectedTicket.value
                    : "";


            const ticketNumber =
                document.getElementById('ticketNumber').value;

            const picName =
                document.getElementById('picName').value;

            const idCust =
                document.getElementById('idCust').value;

            const address =
                document.getElementById('address').value;

            const phone =
                document.getElementById('phone').value;

            const serviceType =
                document.getElementById('serviceType').value;

            const pop =
                document.getElementById('olt').value;

            const issue =
                document.getElementById('issue').value;

            const filledBy =
                document.getElementById('filledBy').value;


            /* ==========================================
               SHARELOC
               ========================================== */

            const sharelocSection =
                document.getElementById('sharelocSection');

            const location =
                document.getElementById('location').value;


            let sharelocOutput = "";


            // Shareloc hanya muncul jika:
            // 1. Insert Shareloc aktif
            // 2. Link Shareloc diisi

            if (
                sharelocSection.classList.contains('active') &&
                location.trim() !== ""
            ) {

                sharelocOutput =
                    `\n\n📍${location}`;

            }


            /* ==========================================
               TEMPLATE AKHIR
               ========================================== */

            const template = `Dear Team ${ticketType},
Mohon bantuan pengecekan pelanggan dengan detail berikut ini:

Nomor tiket		: ${ticketNumber}

PIC Pelanggan	: ${picName}
ID Cust			: ${idCust}
Alamat			: ${address}
Telepon			: ${phone}
Service Type		: ${serviceType}
OLT			: ${pop}

Indikasi: ${issue}${sharelocOutput}

Demikian kami sampaikan,
terima kasih
${filledBy}`;


            document.getElementById('output').textContent =
                template;
        }


        /* ==========================================
           COPY TEMPLATE
           ========================================== */

        function copyTemplate() {

            const output =
                document.getElementById('output').textContent;


            if (output) {

                navigator.clipboard.writeText(output)

                    .then(() => {

                        alert(
                            "Template berhasil disalin ke clipboard!"
                        );

                    })

                    .catch(() => {

                        alert(
                            "Gagal menyalin template. Silakan coba lagi."
                        );

                    });

            } else {

                alert(
                    "Tidak ada template untuk disalin. Silakan isi formulir dan tekan Submit."
                );

            }
        }

    </script>

</body>
</html>
